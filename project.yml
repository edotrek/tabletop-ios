name: TabletopCam
options:
  bundleIdPrefix: com.edotrek
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TabletopCam:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tabletop Cam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: La fotocamera serve per fotografare il tavolo da gioco.
        NSLocalNetworkUsageDescription: L'app invia le foto al server Tabletop sulla rete locale.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.edotrek.tabletopcam
            CFBundleURLSchemes: [tabletopcam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edotrek.tabletopcam
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_PREVIEWS: "NO"
