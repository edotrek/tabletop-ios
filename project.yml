name: TabletopCam
options:
  bundleIdPrefix: com.edotrek
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.17.0
targets:
  TabletopCam:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: LiveKit
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Board Beam Cam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: La fotocamera serve per fotografare il tavolo da gioco.
        NSLocalNetworkUsageDescription: L'app invia le foto al server Board Beam sulla rete locale.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.edotrek.tabletopcam
            CFBundleURLSchemes: [tabletopcam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edotrek.tabletopcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_PREVIEWS: "NO"
